# Render Blueprint: New > Blueprint > pick this repo. Sets up the web service and a Postgres sandbox.
databases:
  - name: agenthub-sandbox
    plan: free
    postgresMajorVersion: "16"   # MERGE needs >= 15

services:
  - type: web
    name: agent-hub
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: agenthub-sandbox, property: connectionString }
      - key: ANTHROPIC_API_KEY
        sync: false            # paste in the Render dashboard, never commit it
      - key: ACCESS_CODE
        sync: false            # optional: only people with this code can spend your API credits
      - key: MODEL_CONVERTER
        value: claude-sonnet-5-5
      - key: MODEL_REVIEWER
        value: claude-sonnet-5-5
